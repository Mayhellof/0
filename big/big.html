<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="./jquery-1.12.2.min.js"></script>
</head>
<style>
  * {
    padding: 0;
    margin: 0;
  }

  .preview {
    width: 500px;
    height: 500px;
    margin-left: 30px;
    border: 1px solid #000;
    text-align: center;
    position: relative;
  }

  .preview>img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    object-position: 0 0;
  }

  .mask {
    display: none;
    width: 200px;
    height: 200px;
    background-color: #fede4f;
    opacity: 0.5;
    position: absolute;
    top: 0;
    left: 0;
  }

  .big {
    display: none;
    width: 500px;
    height: 500px;
    background-color: pink;
    position: absolute;
    top: 0;
    left: 510px;
    z-index: 999;
    overflow: hidden;
  }

  .big>img {
    width: 1200px;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>

<body>
  <div class="preview">
    <img src="./Girlx.png" alt="">
    <div class="mask"></div>
    <div class="big">
      <img src="./Girlx.png" alt="" class="big_img">
    </div>
  </div>
  <script>
    ~ function () {
      let $magnigierBox = $('.magnigierBox'),
        $smallBox = $magnigierBox.find('.smallBox'),
        $mark = $magnigierBox.find('.mark'),
        $bigBox = $magnigierBox.find('.bigBox'),
        $bigImg = $bigBox.find('img');
      //计算当前移动盒子位置，以及大图片位置
      let computedMark = function (event) {
        let minL = 0,
          minT = 0,
          maxL = $smallBox.outerWidth() - $mark.outerWidth(),
          maxT = $smallBox.outerHeight() - $mark.outerWidth(),
          curL = event.pageX - $smallBox.offset().left - $mark.outerWidth() / 2,
          curT = event.pageY - $smallBox.offset().top - $mark.outerHeight() / 2;
        curL = curL < minL ? minL : (curL > maxL ? maxL : curL);
        curT = curT < minT ? minT : (curT > maxT ? maxT : curT);
        $mark.css({
          left: curL,
          top: curT
        });
        $bigImg.css({
          left: -curL * 3,
          top: -curT * 3
        });
      };
      //实现鼠标进入或离开时，mark、bigBox的显隐
      $smallBox.on('mouseenter', (event) => {
        $mark.add($bigBox).css('display', 'block');
        computedMark(event);
      }).on('mouseleave', () => {
        $mark.add($bigBox).css('display', 'none');
      }).on('mousemove', (event) => {
        computedMark(event);
      });
    }();


  </script>
</body>

</html>
