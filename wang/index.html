<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记事本</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto&family=Open+Sans&family=Caveat&family=Playfair+Display&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">
    <h1>📝 记事本</h1>

    <label for="font-select">选择字体：</label>
    <select id="font-select">
      <option value="'Poppins', sans-serif">Poppins（现代）</option>
      <option value="'Roboto', sans-serif">Roboto（简洁）</option>
      <option value="'Open Sans', sans-serif">Open Sans（清晰）</option>
      <option value="'Caveat', cursive">Caveat（手写风）</option>
      <option value="'Playfair Display', serif">Playfair Display（优雅）</option>
    </select>

    <textarea id="note-input" placeholder="在这里写下你的笔记..."></textarea>
    <button id="save-btn">保存笔记</button>
    <button id="clear-btn">🗑 清空所有笔记</button>
    <ul id="notes-list"></ul>
  </div>

  <script src="script.js"></script>
</body>

</html>
